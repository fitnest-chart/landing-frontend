# values.yaml for landing-frontend

replicaCount: 1
image:
  repository: ghcr.io/fitnest-code/landing-frontend
  tag: "development-62c65e3"
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
networkPolicy:
  enabled: true
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  hosts:
    - host: dev.fitnest.az
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - dev.fitnest.az
      secretName: fitnest-tls
  backend:
    service:
      name: "" # Empty means use the chart's fullname (landing-frontend)
      port: 80
resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 1000m
    memory: 384Mi
env:
  NODE_ENV: production
  API_BASE_URL: "http://gateway-backend.fitnest-development.svc.cluster.local/api/v1"
  NEXT_PUBLIC_API_BASE_URL: "/api/proxy"
vaultEnv: development
vault:
  # Same in-cluster HTTP Vault the backends use. Public https://vault.fitnest.az
  # is the prod Vault TLS endpoint; Node Alpine cannot verify that cert.
  addr: "http://vault-dev.fitnest-development.svc.cluster.local:8200"
assetLinks:
  enabled: true
  secretName: assetlinks-secret
